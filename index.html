<!DOCTYPE html>

<html lang="es">
    <head>
        <title>
        Innkeeper - Inicio
        </title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="La posada virtual de tus campañas. Lleva el historial de cada partida, anota las victorias de tu grupo y transforma cada noche de juegos en datos."/>
    </head>

    <body>
        <!-- contenedor para manejar el diseño de la pantalla -->
        <div class="layout-de-la-app">

            <!-- barra lateral de la izquierda -->
            <aside class="sidebar">
                <div class="contenedor-logo">
                    <h2>InnKeeper</h2>
                    <p>Subtitulo</p>
                    
                    <button>Iniciar Partida</button>

                    <nav>
                        <a href="#">Inicio</a>
                        <a href="#">Campañas</a>
                        <a href="#">Historial</a>
                        <a href="#">Amigos</a>
                        <a href="#">Configuracion</a>
                    </nav>
                </div>
            </aside>

            <!-- todo lo que no es la barra (lo de la derecha) -->
             <div class="columna derecha">

                <!-- parte derecha del header -->
                <header>
                    
                    <div>
                        <button>Iniciar Sesion</button>
                    </div>

                </header>

                <main>
                    <section>
                        <h1>Bienvenido a InnKeeper</h1>
                        <p>La posada virtual de tus campañas</p>
                        <form role="search">
                            
                            <input type="text" placeholder="Buscar partidas..."/>
                            
                            <button type="submit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-search">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                                    <path d="M21 21l-6 -6" />
                                </svg>
                            </button>
                        </form>
                    </section>
                    <section>
                        <h3>Partidas Activas</h3>

                    </section>
                    <section>
                        <h3>Estadisticas</h3>
                        
                    </section>
                    <section>
                        <h3>Amigos</h3>
                        
                    </section>
                    <section>
                        <h3>Juegos Recientes</h3>
                        
                    </section>
                </main>

                <footer>

                </footer>

            </div>
        </div>
    </body>
</html>
